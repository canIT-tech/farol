name: Nightly Google Flights

# O provider do Google Flights não é uma API: lê a página pública e depende do
# formato de um <script> que ninguém nos garante. As fixtures em __fixtures__
# mantêm o CI de PR offline e rápido, mas congelam o layout do dia em que foram
# gravadas — um teste verde não prova que a busca real ainda funciona.
#
# Este job é a única coisa que prova. Falhar aqui não quebra nada em produção
# (o FallbackFlightProvider já caiu para o Travelpayouts sozinho), mas avisa
# que o parser precisa de revisão e que as ofertas voltaram a ser preço de
# cache do parceiro.
#
# Para consertar: `pnpm --filter @farol/providers record:google-flights`
# regrava as fixtures, e os specs de normalize-flight apontam o que mudou.
on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch: {}

# Token só de leitura; um job que precise de mais declara o que precisa.
permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @farol/shared build
      - run: pnpm --filter @farol/providers build
      # Uma tentativa e mais uma: o Google às vezes devolve uma página vazia
      # para um IP de datacenter. Duas falhas seguidas já não são acaso.
      - name: Busca real no Google Flights
        run: |
          pnpm --filter @farol/providers smoke:google-flights \
            || (sleep 30 && pnpm --filter @farol/providers smoke:google-flights)

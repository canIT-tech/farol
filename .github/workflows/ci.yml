name: CI

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: farol
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/farol
      NEXT_PUBLIC_API_URL: http://localhost:3333
      # Envs de app: os specs trazem defaults próprios, mas o CI declara aqui
      # para o banco/config ficarem em estado conhecido (débito do Passo 5).
      SUPABASE_JWKS_URL: https://example.com/auth/v1/.well-known/jwks.json
      AMADEUS_CLIENT_ID: amadeus-ci-id
      AMADEUS_CLIENT_SECRET: amadeus-ci-secret
      GOOGLE_PLACES_KEY: google-places-ci
      JOBS_SCHEMA: pgboss_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm --filter @farol/db run db:migrate
      - run: pnpm --filter @farol/db run db:seed
      - run: pnpm --filter @farol/api smoke
      - run: pnpm test
      # No workspace do web: o playwright é devDependency de apps/web e o pnpm
      # não faz hoisting, então `pnpm exec` na raiz não acha o binário.
      - run: pnpm --filter @farol/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # O client.spec de @farol/db dropa o schema durante `pnpm test`, e nada
      # re-migra antes da mutação — que roda os mesmos specs de novo. Sem isto,
      # spec de DB sem tabela estala no retry do pg-boss e o dry run do Stryker
      # estoura por timeout.
      - run: pnpm --filter @farol/db run db:migrate
      - run: pnpm --filter @farol/db run db:seed
      - run: pnpm test:mutation

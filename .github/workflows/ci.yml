name: CI

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

# Token só de leitura; um job que precise de mais declara o que precisa.
permissions:
  contents: read

# Um push novo na mesma branch torna a execução anterior ruído.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: farol
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/farol
      # Banco separado: o client.spec de @farol/db derruba tabelas.
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/farol_test
      NEXT_PUBLIC_API_URL: http://localhost:3333/api
      # Envs de app: os specs trazem defaults próprios, mas o CI declara aqui
      # para o banco/config ficarem em estado conhecido (débito do Passo 5).
      SUPABASE_JWKS_URL: https://example.com/auth/v1/.well-known/jwks.json
      TRAVELPAYOUTS_TOKEN: travelpayouts-ci
      TRAVELPAYOUTS_MARKER: farol-ci
      LITEAPI_KEY: sand_ci
      GOOGLE_PLACES_KEY: google-places-ci
      JOBS_SCHEMA: pgboss_ci
      # Pagamento: provider determinístico, nada bate na Stripe no CI.
      PAYMENT_PROVIDER: fake
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Dependência de produção com CVE moderada ou pior quebra o PR. Dev-only
      # (vitest, vite, CLI do Nest) fica com o Dependabot: não roda no ar.
      - run: pnpm audit --prod --audit-level=moderate
      # O service do Postgres nao monta docker/init-test-db.sql, entao aqui o
      # banco de teste e criado a mao.
      - run: PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE farol_test"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm --filter @farol/db run db:migrate
      - run: pnpm --filter @farol/db run db:seed
      # O farol_test tambem precisa de schema e catalogo: os CLIs de migracao
      # apontam para DATABASE_URL, e os specs usam DATABASE_URL_TEST.
      - run: pnpm --filter @farol/db run db:migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/farol_test
      - run: pnpm --filter @farol/db run db:seed
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/farol_test
      - run: pnpm --filter @farol/api smoke
      - run: pnpm --filter @farol/worker smoke
      - run: pnpm test
      # No workspace do web: o playwright é devDependency de apps/web e o pnpm
      # não faz hoisting, então `pnpm exec` na raiz não acha o binário.
      - run: pnpm --filter @farol/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  # CHANGELOG é gate de merge: seção já lançada não se edita. A entrada em
  # [Unreleased] para mudança visível ao usuário é cobrada na revisão (ver
  # "Shipping" no CLAUDE.md) — o CI não distingue visível de interno.
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: seções lançadas são imutáveis
        run: |
          base="origin/${{ github.base_ref }}"
          git cat-file -e "$base:CHANGELOG.md" 2>/dev/null || exit 0
          old=$(git show "$base:CHANGELOG.md" | sed -n '/^## \[[0-9]/,$p')
          new=$(sed -n '/^## \[[0-9]/,$p' CHANGELOG.md)
          # Uma release nova entra acima; as já lançadas têm que continuar
          # idênticas no fim do arquivo.
          case "$new" in *"$old") ;; *) echo "uma seção já lançada do CHANGELOG foi editada"; exit 1;; esac

  # Varredura de segredo em todo o histórico alcançável do push/PR.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # CLI em container, fixado por digest. A gitleaks-action exige licença
      # paga em repositório de organização; o binário é o mesmo e é livre.
      - name: gitleaks (v8.30.1)
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --verbose

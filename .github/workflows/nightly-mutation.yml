name: Nightly mutation

# Mutação completa, fora do caminho crítico do PR. O CI de PR muta só os
# pacotes tocados; aqui todos, para nenhum pacote ficar sem cobrir por não ter
# sido tocado em nenhum PR.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}

# Token só de leitura; um job que precise de mais declara o que precisa.
permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: farol
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/farol
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/farol_test
      NEXT_PUBLIC_API_URL: http://localhost:3333/api
      SUPABASE_JWKS_URL: https://example.com/auth/v1/.well-known/jwks.json
      TRAVELPAYOUTS_TOKEN: travelpayouts-ci
      TRAVELPAYOUTS_MARKER: farol-ci
      LITEAPI_KEY: sand_ci
      GOOGLE_PLACES_KEY: google-places-ci
      JOBS_SCHEMA: pgboss_nightly
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE farol_test"
      - run: pnpm build
      - run: pnpm --filter @farol/db run db:migrate
      - run: pnpm --filter @farol/db run db:seed
      # O farol_test tambem precisa de schema e catalogo: os CLIs de migracao
      # apontam para DATABASE_URL, e os specs usam DATABASE_URL_TEST.
      - run: pnpm --filter @farol/db run db:migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/farol_test
      - run: pnpm --filter @farol/db run db:seed
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/farol_test
      - run: pnpm test:mutation
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mutation-reports
          path: "**/reports/mutation/*.html"
          if-no-files-found: ignore

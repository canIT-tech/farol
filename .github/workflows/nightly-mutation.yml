name: Nightly mutation

# Mutação completa, fora do caminho crítico do PR. O CI de PR muta só os
# pacotes tocados; aqui todos, para nenhum pacote ficar sem cobrir por não ter
# sido tocado em nenhum PR.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: farol
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/farol
      NEXT_PUBLIC_API_URL: http://localhost:3333
      SUPABASE_JWKS_URL: https://example.com/auth/v1/.well-known/jwks.json
      AMADEUS_CLIENT_ID: amadeus-ci-id
      AMADEUS_CLIENT_SECRET: amadeus-ci-secret
      GOOGLE_PLACES_KEY: google-places-ci
      JOBS_SCHEMA: pgboss_nightly
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @farol/db run db:migrate
      - run: pnpm --filter @farol/db run db:seed
      - run: pnpm test:mutation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-reports
          path: "**/reports/mutation/*.html"
          if-no-files-found: ignore

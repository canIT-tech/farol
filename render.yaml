# Deploy de serviço único no Render (free tier).
#
# Um Web Service só: a api serve as rotas sob /api, registra os handlers do
# pg-boss no próprio processo e entrega o apps/web como catch-all. O free tier
# do Render não tem Background Worker, e um serviço a menos é um serviço a menos
# para manter.
#
# Postgres e Auth ficam no Supabase; LLM na Groq. As envs marcadas sync: false
# são preenchidas no dashboard ou pelo MCP — não entram no repo.
services:
  - type: web
    name: farol
    runtime: node
    plan: free
    region: oregon
    branch: main
    # Migration e seed ficam FORA do build: o banco é compartilhado com outra
    # pessoa, então migrar roda por MCP com autorização explícita, só quando o
    # schema mudar.
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # A api escuta em API_PORT (não em PORT); 10000 é a porta padrão do Render.
      - key: API_PORT
        value: "10000"
      # O prefixo /api e o catch-all do Next vivem no mesmo processo, então o
      # front chama a api por caminho relativo.
      - key: NEXT_PUBLIC_API_URL
        value: /api
      - key: SERVE_WEB
        value: "true"
      - key: RUN_JOB_HANDLERS
        value: "true"
      - key: JOBS_SCHEMA
        value: pgboss
      # Travelpayouts (Passo 10). Token é segredo, marker é id de afiliado.
      - key: TRAVELPAYOUTS_TOKEN
        sync: false
      - key: TRAVELPAYOUTS_MARKER
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: GOOGLE_PLACES_KEY
        sync: false
      # Provider e modelos são configuração, não segredo: ficam literais aqui.
      # Só os gpt-oss têm structured output com JSON schema na Groq.
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL_CAPABLE
        value: openai/gpt-oss-120b
      - key: LLM_MODEL_CHEAP
        value: openai/gpt-oss-20b
      - key: LLM_API_KEY
        sync: false
